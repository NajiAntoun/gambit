<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#162616"/>

  <!-- Subtle inner radial gradient for depth -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1f3a1f"/>
      <stop offset="100%" stop-color="#111e11"/>
    </radialGradient>
    <!-- Gold shimmer gradient on the pawn -->
    <linearGradient id="gold" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#e0bc6a"/>
      <stop offset="50%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a8892e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Pawn: head -->
  <circle cx="50" cy="26" r="13" fill="url(#gold)"/>

  <!-- Pawn: neck + body (tapered from narrow neck down to wider torso) -->
  <path d="M46,38 C41,45 34,55 33,63 L67,63 C66,55 59,45 54,38 Z" fill="url(#gold)"/>

  <!-- Pawn: base platform -->
  <rect x="26" y="63" width="48" height="13" rx="6.5" fill="url(#gold)"/>
</svg>
